<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bếp Mẹ Thỏ · Lộ trình 30 ngày</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FDF4DE;
    --cream-deep:#F7E9C6;
    --ink:#2B2418;
    --ink-soft:#5A5040;
    --sage:#445D3E;
    --sage-deep:#324530;
    --raspberry:#C9184A;
    --honey:#E8A93D;
    --line:#E4DCC8;
    --paper:#FFFCF4;
    --radius:14px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Be Vietnam Pro', sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3{
    font-family:'Literata', serif;
    margin:0;
    color:var(--ink);
  }

  a{color:var(--sage-deep);}

  .mono{font-family:'JetBrains Mono', monospace;}

  /* ===== Header ===== */
  header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(253,244,222,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .header-top{
    max-width:1100px;
    margin:0 auto;
    padding:16px 24px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .rabbit{font-size:1.4rem;}
  .brand-name{font-family:'Literata',serif; font-weight:700; font-size:1.25rem;}
  .brand-sub{font-size:0.82rem; color:var(--ink-soft);}

  .overall-progress{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:0.82rem;
    color:var(--ink-soft);
  }
  .overall-bar{
    width:140px;
    height:8px;
    border-radius:99px;
    background:var(--line);
    overflow:hidden;
  }
  .overall-bar-fill{
    height:100%;
    background:var(--raspberry);
    width:0%;
    transition:width 0.4s ease;
  }
  .overall-num{font-family:'JetBrains Mono',monospace; color:var(--ink); font-weight:600;}

  /* ===== Day track (signature element) ===== */
  .day-track-wrap{
    max-width:1100px;
    margin:0 auto;
    padding:0 24px 14px;
    overflow-x:auto;
  }
  .day-track{
    display:flex;
    gap:3px;
    min-width:600px;
  }
  .day-cell{
    flex:1;
    height:22px;
    border-radius:3px;
    background:var(--line);
    position:relative;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.15s ease;
  }
  .day-cell:hover{transform:scaleY(1.15);}
  .day-cell.done{background:var(--sage);}
  .day-cell.active-week{outline:2px solid var(--raspberry); outline-offset:1px;}
  .day-track-labels{
    display:flex;
    justify-content:space-between;
    max-width:1100px;
    margin:0 auto;
    padding:0 24px 14px;
    font-size:0.72rem;
    color:var(--ink-soft);
    min-width:600px;
  }

  /* ===== Tabs ===== */
  .tabs{
    max-width:1100px;
    margin:0 auto;
    padding:0 24px 16px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .tab-btn{
    font-family:'Be Vietnam Pro', sans-serif;
    font-weight:600;
    font-size:0.88rem;
    padding:9px 16px;
    border-radius:99px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .tab-btn:hover{border-color:var(--sage);}
  .tab-btn:focus-visible{outline:2px solid var(--raspberry); outline-offset:2px;}
  .tab-btn.active{
    background:var(--sage);
    border-color:var(--sage);
    color:#fff;
  }

  /* ===== Main ===== */
  main{
    max-width:1100px;
    margin:0 auto;
    padding:8px 24px 80px;
  }

  .week-panel{display:none; animation:fadeIn 0.35s ease;}
  .week-panel.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .week-hero{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px 28px 24px;
    margin-bottom:28px;
    position:relative;
    overflow:hidden;
  }
  .week-hero::before{
    content:"";
    position:absolute;
    top:0; right:0;
    width:140px; height:140px;
    background:radial-gradient(circle at top right, var(--honey) 0%, transparent 70%);
    opacity:0.35;
  }
  .week-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:0.78rem;
    letter-spacing:0.06em;
    color:var(--raspberry);
    text-transform:uppercase;
    margin-bottom:8px;
    display:block;
  }
  .week-title{
    font-size:1.7rem;
    font-weight:700;
    margin-bottom:10px;
  }
  .week-goal{
    color:var(--ink-soft);
    max-width:640px;
    margin-bottom:16px;
    font-size:0.96rem;
  }
  .week-meta{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    align-items:center;
  }
  .kpi-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--sage);
    color:#fff;
    padding:8px 14px;
    border-radius:99px;
    font-size:0.82rem;
    font-weight:600;
  }
  .week-progress-inline{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.82rem;
    color:var(--ink-soft);
  }
  .week-progress-bar{
    width:120px;
    height:6px;
    border-radius:99px;
    background:var(--line);
    overflow:hidden;
  }
  .week-progress-fill{
    height:100%;
    background:var(--raspberry);
    width:0%;
    transition:width 0.4s ease;
  }

  /* ===== Task list ===== */
  .task-list-title{
    font-size:0.85rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    margin:0 0 12px 4px;
    font-weight:600;
  }
  .task-card{
    display:flex;
    gap:14px;
    align-items:flex-start;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    transition:border-color 0.2s ease, opacity 0.2s ease;
  }
  .task-card:hover{border-color:var(--sage);}
  .task-card.checked{opacity:0.55;}
  .task-card.checked .task-text{text-decoration:line-through; text-decoration-color:var(--sage);}

  .task-check{
    flex-shrink:0;
    width:22px;
    height:22px;
    border-radius:6px;
    border:2px solid var(--sage);
    background:transparent;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    margin-top:2px;
  }
  .task-check.on{background:var(--sage);}
  .task-check:focus-visible{outline:2px solid var(--raspberry); outline-offset:2px;}

  .task-day{
    flex-shrink:0;
    font-family:'JetBrains Mono', monospace;
    font-size:0.76rem;
    font-weight:600;
    background:var(--cream-deep);
    color:var(--sage-deep);
    padding:4px 8px;
    border-radius:6px;
    min-width:52px;
    text-align:center;
    margin-top:1px;
  }
  .task-body{flex:1; min-width:0;}
  .task-text{font-size:0.94rem; margin-bottom:5px;}
  .task-foot{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    font-size:0.78rem;
    color:var(--ink-soft);
  }
  .task-owner{
    font-weight:600;
    color:var(--raspberry);
  }
  .task-note{font-style:italic;}

  /* ===== Extra note ===== */
  .extra-note{
    background:var(--cream-deep);
    border-left:3px solid var(--honey);
    border-radius:8px;
    padding:14px 18px;
    margin-top:20px;
    font-size:0.88rem;
    color:var(--ink-soft);
  }
  .extra-note strong{color:var(--ink);}

  /* ===== Combo table (Week 2 only) ===== */
  .combo-section{margin-top:28px;}
  .combo-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
    gap:14px;
  }
  .combo-card{
    background:var(--sage);
    color:#fff;
    border-radius:var(--radius);
    padding:20px;
  }
  .combo-name{font-family:'Literata',serif; font-weight:700; font-size:1.1rem; margin-bottom:6px;}
  .combo-price{font-family:'JetBrains Mono',monospace; font-size:1.5rem; color:var(--honey); margin-bottom:10px;}
  .combo-items{font-size:0.85rem; opacity:0.92; margin-bottom:10px;}
  .combo-purpose{font-size:0.78rem; opacity:0.75; border-top:1px solid rgba(255,255,255,0.2); padding-top:10px;}

  /* ===== Role table footer ===== */
  .role-section{
    margin-top:50px;
    padding-top:30px;
    border-top:1px solid var(--line);
  }
  .role-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-top:16px;
  }
  .role-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
  }
  .role-card h4{
    font-family:'Literata',serif;
    font-size:1.05rem;
    margin-bottom:8px;
    color:var(--sage-deep);
  }
  .role-card p{font-size:0.88rem; color:var(--ink-soft); margin:4px 0;}

  footer{
    text-align:center;
    padding:30px 24px 40px;
    font-size:0.8rem;
    color:var(--ink-soft);
  }

  @media (max-width:640px){
    .role-grid{grid-template-columns:1fr;}
    .week-title{font-size:1.4rem;}
    .header-top{flex-direction:column; align-items:flex-start;}
    .task-card{flex-wrap:wrap;}
  }
</style>
</head>

    kpi:"50 đơn hàng · 15 review 5 sao",
    tasks:[
      {day:"22", text:"Tung chương trình Ra mắt: giảm giá hoặc tặng kèm cho 20 đơn đầu tiên", owner:"Vợ", note:"Tặng thêm 1 hũ Mix vị cho đơn từ 100k, tạo cảm giác khan hiếm"},
      {day:"22-23", text:"Kích hoạt kịch bản gom đơn qua Zalo/Messenger", owner:"Vợ", note:"Chào hỏi, xác nhận combo, xác nhận địa chỉ, thời gian giao, lời cảm ơn"},
      {day:"23-24", text:"Thiết lập quy trình gọi ship nội thành", owner:"Vợ và Chồng", note:"Chốt 1 đến 2 đối tác ship quen, đóng gói kèm túi giữ lạnh"},
      {day:"24-25", text:"Chạy quảng cáo nhỏ Facebook nhắm khu vực Thủ Đức", owner:"Chồng", note:"Ngân sách thử nghiệm nhỏ trước, theo dõi tỷ lệ chuyển đổi"},
      {day:"25-27", text:"Sau mỗi đơn giao thành công, gửi lời nhắn xin đánh giá Google Maps kèm link trực tiếp", owner:"Vợ", note:"Cảm ơn chị đã tin tưởng Bếp Mẹ Thỏ, mời để lại 5 sao trên Google"},
      {day:"26-28", text:"Theo dõi và trả lời từng review, kể cả review góp ý", owner:"Vợ", note:"Phản hồi nhanh trong vài giờ để tạo thiện cảm"},
      {day:"27-29", text:"Tổng hợp danh sách khách đã mua, phân loại theo chung cư", owner:"Vợ", note:"Ghi vào file đơn giản, chuẩn bị remarketing tuần sau"},
      {day:"29-30", text:"Đánh giá lại toàn bộ chỉ số: số đơn, số review, vị trí GMB trên bản đồ", owner:"Vợ và Chồng", note:"Điều chỉnh combo hoặc content dựa trên dữ liệu thực tế"}
    ],
    extraNote:"Đặt mục tiêu tối thiểu 15 review 5 sao trong tuần 4, vì đây là giai đoạn Google đánh giá độ uy tín ban đầu của hồ sơ."
  }
];

const state = {};
WEEKS.forEach(w => { state[w.number] = w.tasks.map(() => false); });
let activeWeek = 1;

function countProgress(weekNumber){
  const arr = state[weekNumber];
  const done = arr.filter(Boolean).length;
  return {done, total: arr.length};
}

function overallProgress(){
  let done=0, total=0;
  WEEKS.forEach(w=>{
    const p = countProgress(w.number);
    done += p.done; total += p.total;
  });
  return {done, total};
}

function renderDayTrack(){
  const track = document.getElementById('dayTrack');
  track.innerHTML = '';
  for(let d=1; d<=30; d++){
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    const week = WEEKS.find(w => d >= w.days[0] && d <= w.days[1]);
    if(week.number === activeWeek) cell.classList.add('active-week');
    cell.title = 'Ngày ' + d + ' · Tuần ' + week.number;
    cell.addEventListener('click', () => switchWeek(week.number));
    track.appendChild(cell);
  }
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  WEEKS.forEach(w => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (w.number === activeWeek ? ' active' : '');
    btn.textContent = 'Tuần ' + w.number;
    btn.addEventListener('click', () => switchWeek(w.number));
    tabs.appendChild(btn);
  });
}

function taskCard(weekNumber, task, idx){
  const checked = state[weekNumber][idx];
  const card = document.createElement('div');
  card.className = 'task-card' + (checked ? ' checked' : '');

  const check = document.createElement('button');
  check.className = 'task-check' + (checked ? ' on' : '');
  check.setAttribute('aria-label', 'Đánh dấu hoàn thành: ' + task.text);
  check.innerHTML = checked ? '✓' : '';
  check.addEventListener('click', () => {
    state[weekNumber][idx] = !state[weekNumber][idx];
    renderWeekPanel(weekNumber);
    updateProgressUI();
  });

  const day = document.createElement('div');
  day.className = 'task-day mono';
  day.textContent = 'Ngày ' + task.day;

  const body = document.createElement('div');
  body.className = 'task-body';
  const text = document.createElement('div');
  text.className = 'task-text';
  text.textContent = task.text;
  const foot = document.createElement('div');
  foot.className = 'task-foot';
  const owner = document.createElement('span');
  owner.className = 'task-owner';
  owner.textContent = task.owner;
  foot.appendChild(owner);
  if(task.note){
    const note = document.createElement('span');
    note.className = 'task-note';
    note.textContent = task.note;
    foot.appendChild(note);
  }
  body.appendChild(text);
  body.appendChild(foot);

  card.appendChild(check);
  card.appendChild(day);
  card.appendChild(body);
  return card;
}

function renderWeekPanel(weekNumber){
  const week = WEEKS.find(w => w.number === weekNumber);
  const panel = document.getElementById('panel-' + weekNumber);
  if(!panel) return;

  const listWrap = panel.querySelector('.task-list-wrap');
  listWrap.innerHTML = '';
  week.tasks.forEach((t, i) => listWrap.appendChild(taskCard(weekNumber, t, i)));

  const p = countProgress(weekNumber);
  const pct = p.total ? Math.round((p.done/p.total)*100) : 0;
  panel.querySelector('.week-progress-fill').style.width = pct + '%';
  panel.querySelector('.week-progress-text').textContent = p.done + '/' + p.total + ' việc';
}

function buildWeekPanel(week){
  const panel = document.createElement('section');
  panel.className = 'week-panel';
  panel.id = 'panel-' + week.number;

  let comboHTML = '';
  if(week.combos){
    comboHTML = `
      <div class="combo-section">
        <div class="task-list-title">Gợi ý 3 gói combo</div>
        <div class="combo-grid">
          ${week.combos.map(c => `
            <div class="combo-card">
              <div class="combo-name">${c.name}</div>
              <div class="combo-price mono">${c.price}</div>
              <div class="combo-items">${c.items}</div>
              <div class="combo-purpose">${c.purpose}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  panel.innerHTML = `
    <div class="week-hero">
      <span class="week-eyebrow">Ngày ${week.days[0]} đến ${week.days[1]}</span>
      <h2 class="week-title">Tuần ${week.number}: ${week.title}</h2>
      <p class="week-goal">${week.goal}</p>
      <div class="week-meta">
        <span class="kpi-badge">🎯 ${week.kpi}</span>
        <div class="week-progress-inline">
          <div class="week-progress-bar"><div class="week-progress-fill"></div></div>
          <span class="week-progress-text mono">0/0 việc</span>
        </div>
      </div>
    </div>

    <div class="task-list-title">Danh sách công việc</div>
    <div class="task-list-wrap"></div>

    ${comboHTML}

    <div class="extra-note"><strong>Lưu ý:</strong> ${week.extraNote}</div>
  `;

  return panel;
}

function switchWeek(weekNumber){
  activeWeek = weekNumber;
  document.querySelectorAll('.week-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + weekNumber).classList.add('active');
  renderTabs();
  renderDayTrack();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function updateProgressUI(){
  WEEKS.forEach(w => {
    const p = countProgress(w.number);
    const pct = p.total ? Math.round((p.done/p.total)*100) : 0;
    const panel = document.getElementById('panel-' + w.number);
    if(panel){
      panel.querySelector('.week-progress-fill').style.width = pct + '%';
      panel.querySelector('.week-progress-text').textContent = p.done + '/' + p.total + ' việc';
    }
  });
  const o = overallProgress();
  const opct = o.total ? Math.round((o.done/o.total)*100) : 0;
  document.getElementById('overallFill').style.width = opct + '%';
  document.getElementById('overallNum').textContent = opct + '% (' + o.done + '/' + o.total + ')';
}

function init(){
  const main = document.getElementById('main');
  WEEKS.forEach(w => {
    const panel = buildWeekPanel(w);
    if(w.number === activeWeek) panel.classList.add('active');
    main.appendChild(panel);
  });

  // role section appended to last panel's container area (as separate block at end of page)
  const roleSection = document.createElement('div');
  roleSection.className = 'role-section';
  roleSection.innerHTML = `
    <h3>Phân công vai trò xuyên suốt 30 ngày</h3>
    <div class="role-grid">
      <div class="role-card">
        <h4>Vợ · Sản xuất, chăm sóc khách</h4>
        <p>Đóng gói, chất lượng sản phẩm, trả lời khách, xin review.</p>
        <p>Công cụ chính: Zalo, Messenger, điện thoại chụp ảnh.</p>
      </div>
      <div class="role-card">
        <h4>Chồng · Kỹ thuật, SEO</h4>
        <p>GMB kỹ thuật, Landing Page, SEO on page, theo dõi chỉ số.</p>
        <p>Công cụ chính: Google Search Console, code Landing Page, Google Business Profile Manager.</p>
      </div>
    </div>
  `;
  main.appendChild(roleSection);

  renderTabs();
  renderDayTrack();
  WEEKS.forEach(w => renderWeekPanel(w.number));
  updateProgressUI();
}

init();
</script>
</body>
</html>
